<!DOCTYPE html>
<!-- 声明文档类型为HTML5 -->
<html lang="zh-CN">
<!-- lang属性指定页面语言为简体中文 -->
<head>
    <meta charset="UTF-8">
    <!-- 设置字符编码为UTF-8，避免中文乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 适配移动端，设置视口宽度为设备宽度，初始缩放比例1.0 -->
    <title>我的第一个HTML页面</title>
    <!-- 页面标题，显示在浏览器标签栏 -->
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面主体样式 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            padding: 20px;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 主要内容区域样式 */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 段落样式 */
        p {
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* 按钮样式 */
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        /* 按钮悬停效果 */
        button:hover {
            background-color: #0056b3;
        }

        /* 页脚样式 */
        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 页面头部 -->
    <header>
        <h1>欢迎来到我的页面</h1>
        <p>这是一个简单的HTML示例页面</p>
    </header>

    <!-- 主要内容 -->
    <div class="main-content">
        <h2>关于我</h2>
        <p>我是一名编程学习者，正在学习HTML、CSS和JavaScript。</p>
        <p>HTML是构建网页的基础，CSS用于美化页面，JavaScript可以实现页面交互。</p>
        
        <!-- 交互按钮 -->
        <button onclick="alert('你点击了按钮！')">点击我</button>
    </div>

    <!-- 页面页脚 -->
    <footer>
        <p>© 2025 我的第一个HTML页面 - 保留所有权利</p>
    </footer>
</body>
</html>
